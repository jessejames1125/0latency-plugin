name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  manifests:
    name: manifests and leak check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate plugin manifests are well-formed JSON
        run: |
          node -e "
            const fs = require('fs');
            for (const f of ['.claude-plugin/plugin.json', '.claude-plugin/marketplace.json', 'package.json']) {
              JSON.parse(fs.readFileSync(f, 'utf8'));
              console.log('ok  ' + f);
            }
          "

      - name: Plugin name and version agree across manifests
        run: |
          node -e "
            const fs = require('fs');
            const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'));
            const market = JSON.parse(fs.readFileSync('.claude-plugin/marketplace.json', 'utf8'));
            const entry = market.plugins.find(p => p.name === plugin.name);
            if (!entry) throw new Error('marketplace.json has no entry for plugin ' + plugin.name);
            if (entry.version !== plugin.version) {
              throw new Error('version mismatch: plugin.json ' + plugin.version + ' vs marketplace.json ' + entry.version);
            }
            console.log('ok  ' + plugin.name + '@' + plugin.version + ' consistent');
          "

      - name: Leak check
        run: bash scripts/leak-check.sh
